name: Test arm64

# Full arm64 test — runs the REAL chain natively on a GitHub arm64 runner:
#   engine (patched, dedicated build) -> metamod -> AMX Mod X core ->
#   modules attach -> plugins load -> map spawn -> amxx.cfg (amx_scrollmsg!)
#
# The AMXX chain is compiled for the host arch with -D__ANDROID__ so the
# exact Android code paths (MM_GAMELIBDIR, libamxx_<name>.so loading,
# 64-bit-pointer/32-bit-cell AMX VM) are exercised on real arm64 hardware.
# This is the same crash path that killed v8/v9 (amx_scrollmsg ->
# amx_Exec -> amx_Callback).

on:
  workflow_run:
    workflows: [ "Build APKs" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build engine (dedicated) for host arch
        shell: bash
        run: |
          cd xash3d-fwgs-master
          python3 ./waf configure -T release -d -8
          python3 ./waf build

      - name: Fetch hlsdk-portable (gitignored inside engine source)
        shell: bash
        run: |
          git clone --depth 1 -b mobile_hacks --recursive --shallow-submodules \
            https://github.com/FWGS/hlsdk-portable \
            xash3d-fwgs-master/3rdparty/hlsdk-portable

      - name: Build HL gamedll for host arch
        shell: bash
        run: |
          cd xash3d-fwgs-master/3rdparty/hlsdk-portable
          python3 ./waf configure -T release -8
          python3 ./waf build

      - name: Build metamod + AMX Mod X chain for host arch
        shell: bash
        run: |
          bash glue/build_host_chain.sh

      # v35: build the REAL cstrike gamedll (same ReGameDLL source as the
      # Android libcs_android.so) + YaPB so the full cstrike chain test can
      # run natively on arm64 -- battery plugin + cvar diagnostics included
      - name: Build cstrike gamedll + YaPB (BUILD_SERVER=ON)
        shell: bash
        run: |
          cmake -S cs16-client-main -B out/cs-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CLIENT=OFF -DBUILD_MAINUI=OFF -DBUILD_SERVER=ON
          cmake --build out/cs-build -j$(nproc)

      # v27 regression test: executes the REAL register_native trampoline
      # bytes (amxx_dyna_codegen.h) natively — catches bad instruction
      # encodings like the aarch64 `ldr x17, [pc, #4]` bug that crashed
      # every plugin-provided native (Zombie Plague RegisterHamBots)
      - name: Verify register_native dyna trampoline codegen
        shell: bash
        run: |
          mkdir -p out/host-test
          cc -O0 -Wall -I amxmodx-FWGS/amxmodx scripts/dyna_tramp_test.c -o out/host-test/dyna_tramp_test
          out/host-test/dyna_tramp_test

      - name: Run full AMXX chain test and evaluate
        shell: bash
        run: bash scripts/run_host_test.sh

      # v35: the FULL cstrike chain on arm64 -- engine -> metamod -> AMXX ->
      # real ReGameDLL gamedll, every staged plugin + battery_test + cvar_suite.
      # v36: NO compat plugin any more -- the AMXX CORE auto-creates missing
      # cvars (bot_quota etc.) and null pcvar handles are silent no-ops. Gates:
      # core auto-create + shared-handle + owner-late-registration semantics,
      # no runtime errors, no crashes. ham-probe gates are informational here
      # (hamdata.ini never matches the locally built ReGameDLL; device gamedll
      # verified).
      - name: Run full cstrike gamedll test (battery + cvar suite)
        shell: bash
        env:
          CS_HOST_TEST_MODE: ci
        run: bash scripts/run_cstrike_host_test.sh

      # v17: client-connect regression test (the v16 device crash happened at
      # "Trying to connect with modern protocol" — dedicated CI runs never
      # connect a client, so that whole layer was untested)
      - name: Install client-test dependencies
        shell: bash
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq libsdl2-dev libfreetype-dev libfreetype6-dev xvfb x11-utils || \
            sudo apt-get install -y -qq xvfb || true

      - name: Build engine (full, with client + ref_soft)
        shell: bash
        run: |
          cd xash3d-fwgs-master
          # v20 fix: --enable-soft is required — ref/soft is opt-in in FWGS waf
          # (default build only makes ref_gl), so run_client_test.sh could never
          # find libref_soft.so and the client-connect test always failed with
          # "Can't initialize any renderer"
          python3 ./waf configure -o build-full -T release -8 --enable-soft
          python3 ./waf build

      - name: Run client-connect test and evaluate
        shell: bash
        run: bash glue/run_client_test.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-test-logs
          path: |
            out/host-test/console.txt
            out/host-test/engine.log
            out/client-test/console.txt
            out/client-test/engine.log
            out/cs-host-test/console.txt
            out/cs-host-test/engine.log
          if-no-files-found: warn

      - name: Telegram report
        if: always()
        shell: bash
        run: |
          [ -n "${{ secrets.TG_BOT_TOKEN }}" ] || exit 0
          ARCH=$(uname -m)
          RES=""
          if [ -f out/host-test/console.txt ] && grep -q "Scrolling message" out/host-test/console.txt && ! grep -q "Crash: signal" out/host-test/console.txt; then
            RES="$(printf '%s\n%s' "$RES" "✅ تست سرور arm64 ($ARCH) موفق — زنجیره کامل بدون کرش")"
          else
            RES="$(printf '%s\n%s' "$RES" "❌ تست سرور arm64 ($ARCH) شکست — لاگ‌ها در آرتیفکت‌های اکشن")"
          fi
          if [ -f out/client-test/console.txt ] && grep -q "became an admin" out/client-test/console.txt && ! grep -q "Crash: signal" out/client-test/console.txt; then
            RES="$(printf '%s\n%s' "$RES" "✅ تست اتصال کلاینت arm64 ($ARCH) موفق — کلاینت وصل شد، get_user_authid (مسیر کرش v16) سالم")"
          else
            RES="$(printf '%s\n%s' "$RES" "❌ تست اتصال کلاینت arm64 ($ARCH) شکست — لاگ‌ها در آرتیفکت‌های اکشن")"
          fi
          # v36: full cstrike chain gate = core auto-create + no crashes
          if [ -f out/cs-host-test/console.txt ] && grep -q "CVAR] 3 auto bot_quota ptr=[1-9]" out/cs-host-test/console.txt && grep -q "CVAR] 8 null-handle semantics OK" out/cs-host-test/console.txt && ! grep -qE "Crash: signal|SIGSEGV|Segmentation" out/cs-host-test/console.txt; then
            RES="$(printf '%s\n%s' "$RES" "✅ تست کامل cstrike روی arm64 موفق — هسته AMXX خودش cvarهای گم‌شده را می‌سازد (بدون پلاگین سازگاری) + کل API cvar سالم")"
          else
            RES="$(printf '%s\n%s' "$RES" "❌ تست کامل cstrike arm64 شکست — out/cs-host-test/console.txt را ببین")"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" -d text="$RES" > /dev/null || true
